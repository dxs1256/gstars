<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stars Atlas · GitHub 星标索引</title>
<meta name="description" content="把 GitHub Stars 整理成可检索的数据网格：按领域、主题、语言、形态多维筛选与排序。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23eef1f4'/><rect x='6' y='8' width='20' height='3' rx='1' fill='%23172a45'/><rect x='6' y='14' width='14' height='3' rx='1' fill='%232f6feb'/><rect x='6' y='20' width='17' height='3' rx='1' fill='%23172a45'/></svg>"><link rel="alternate" type="application/rss+xml" title="Stars Atlas · 全部新收藏" href="feed.xml">
<link rel="alternate" type="application/rss+xml" title="Stars Atlas · 各领域" href="feed-ai.xml">
<link rel="describedby" type="application/json" href="api/index.json">
<link rel="alternate" type="application/json" title="Stars Atlas 数据接口目录" href="api/index.json">
<link rel="llms" type="text/plain" href="llms.txt">

<style>
/* ════════════════════════════════════════════════════════════
   1. 设计令牌
   ════════════════════════════════════════════════════════════ */
:root {
    --bg:        #f4f6f8;
    --panel:     #ffffff;
    --panel-2:   #f9fafb;
    --line:      #e2e6ea;
    --line-2:    #cdd4dc;
    --fg:        #14181f;
    --fg-2:      #4d5561;
    --fg-3:      #858d99;
    --sel:       #2f6feb;
    --sel-bg:    #eaf1fe;
    --star:      #a06d05;
    --ok:        #1a7f4b;
    --shadow:    0 12px 32px -22px rgba(15, 22, 36, .45);

    --radius:    6px;
    --radius-sm: 4px;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --serif: 'Fraunces', 'Songti SC', Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --row-h: 30px;
}
html[data-theme='dark'] {
    --bg:        #0c0f14;
    --panel:     #141920;
    --panel-2:   #10151b;
    --line:      #232a34;
    --line-2:    #333c49;
    --fg:        #e6eaf0;
    --fg-2:      #a4adbb;
    --fg-3:      #6d7787;
    --sel:       #6d9ee8;
    --sel-bg:    #17263d;
    --star:      #d9b356;
    --ok:        #5fbf7f;
    --shadow:    0 16px 40px -26px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--sans); font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: var(--sel); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; border-radius: 3px; }
::selection { background: var(--sel-bg); }

.sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
    position: absolute; left: 50%; top: -3rem; transform: translateX(-50%);
    background: var(--sel); color: #fff; padding: .5rem 1rem; z-index: 100;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm); text-decoration: none;
    transition: top .2s var(--ease);
}
.skip:focus { top: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ════════════════════════════════════════════════════════════
   2. 应用骨架：顶栏 + 三栏
   ════════════════════════════════════════════════════════════ */
.app {
    display: grid;
    grid-template-columns: 204px minmax(0, 1fr) 352px;
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
    max-width: 100vw;
    overflow: hidden;
}

/* 顶栏 */
.topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 14px;
    height: 50px; padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    z-index: 20;
}
.brand { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.brand b { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
.brand span { color: var(--fg-3); font-size: .78rem; }
.search {
    flex: 1; max-width: 440px;
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    padding: 5px 10px; background: var(--panel);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.search:focus-within { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel-bg); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; background: none; color: var(--fg); }
.search input::placeholder { color: var(--fg-3); }
.search kbd { font-family: var(--sans); font-size: .7rem; color: var(--fg-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 .3rem; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-stat { color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
.tb-stat b { color: var(--fg); font-weight: 600; }
.toggle {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    padding: 4px 9px; color: var(--fg-2); font-size: 12.5px;
    white-space: nowrap;   /* 顶栏按钮的文字不折行，挤不下时整颗换行 */
    transition: color .15s var(--ease), border-color .15s var(--ease);
}
.toggle:hover { color: var(--fg); border-color: var(--fg-3); }
.filter-open { display: none; }

/* 左：分面筛选 */
.rail {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px 0 40px;
    scrollbar-width: thin;
}
.rail::-webkit-scrollbar { width: 7px; }
.rail::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.rail-close { display: none; }
.group { padding: 0 12px 15px; }
.group > h2 {
    margin: 0 0 7px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--fg-3); font-weight: 600;
}
.spine { display: flex; flex-direction: column; }
.spine-row {
    display: grid; grid-template-columns: 6px minmax(0, 1fr) auto;
    align-items: center; gap: 7px;
    width: 100%; padding: 3px 7px; border-radius: var(--radius-sm);
    text-align: left; color: var(--fg-2);
    transition: background .13s var(--ease), color .13s var(--ease);
}
.spine-row:hover { background: var(--panel-2); color: var(--fg); }
html[data-theme='dark'] .spine-row:hover { background: #1a212b; }
.spine-row[aria-pressed='true'] { background: var(--sel-bg); color: var(--sel); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 2px; display: block; }
.spine-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spine-count { color: var(--fg-3); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.spine-row[aria-pressed='true'] .spine-count { color: var(--sel); }
.spine-row.is-empty { opacity: .42; }

.subs { margin: 1px 0 5px 20px; display: flex; flex-direction: column; }
.sub-row {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 2px 7px; border-radius: var(--radius-sm);
    font-size: 12px; color: var(--fg-3); text-align: left;
}
.sub-row:hover { color: var(--fg); background: var(--panel-2); }
html[data-theme='dark'] .sub-row:hover { background: #1a212b; }
.sub-row[aria-pressed='true'] { color: var(--sel); background: var(--sel-bg); font-weight: 500; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line-2); border-radius: 999px;
    padding: 1px 8px; font-size: 11.5px; color: var(--fg-2);
    max-width: 100%;
    transition: border-color .13s var(--ease), color .13s var(--ease), background .13s var(--ease);
}
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip[aria-pressed='true'] { background: var(--sel-bg); border-color: var(--sel); color: var(--sel); }
.chip .c { color: var(--fg-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed='true'] .c { color: inherit; }
.chip:disabled { opacity: .35; cursor: not-allowed; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet-more { font-size: 11.5px; color: var(--sel); padding: 3px 2px 0; }
.facet-search {
    width: 100%; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 4px 7px; color: var(--fg); font-size: 12px;
}
html[data-theme='dark'] .facet-search { background: #10151b; }
.note { color: var(--fg-3); font-size: 12px; padding: 2px 0; }

/* 中：表格 */
.main { display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
.bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 7px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 6;
}
.bar-count { color: var(--fg-3); font-size: 12.5px; }
.bar-count b { color: var(--fg); font-weight: 600; }
.active { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.active:empty { display: none; }
.clear { font-size: 12px; color: var(--fg-3); text-decoration: underline; text-underline-offset: 2px; }
.clear:hover { color: var(--fg); }

.tablewrap { flex: 1; overflow: auto; min-width: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
thead th {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel-2); border-bottom: 1px solid var(--line-2);
    text-align: left; padding: 6px 10px; font-weight: 600; color: var(--fg-2);
    white-space: nowrap; cursor: pointer; user-select: none;
}
html[data-theme='dark'] thead th { background: #171d25; }
thead th:hover { color: var(--fg); }
thead th[aria-sort] { color: var(--sel); }
thead th .ar { font-size: 9.5px; }
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
html[data-theme='dark'] tbody tr:hover { background: #1a212b; }
tbody tr.sel { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--sel); }
td { padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22rem; }
td.name b { font-weight: 600; }
td.name span { color: var(--fg-3); }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
td.star { color: var(--star); font-weight: 600; }
td.dim { color: var(--fg-3); }
td .dm { display: inline-flex; align-items: center; gap: 5px; }
.empty {
    padding: 3.5rem 1rem; text-align: center; color: var(--fg-2);
}
.empty h3 { font-family: var(--serif); font-size: 1.1rem; margin-bottom: .4rem; }
.empty p { color: var(--fg-3); font-size: 12.5px; margin-bottom: 1rem; }
.btn {
    display: inline-block; border: 1px solid var(--line-2); border-radius: var(--radius-sm);
    padding: 5px 11px; font-size: 12.5px; color: var(--fg);
}
.btn:hover { border-color: var(--sel); color: var(--sel); text-decoration: none; }
.btn.primary { background: var(--sel); color: #fff; border-color: var(--sel); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
#sentinel { height: 1px; }

/* 右：详情面板 */
.detail {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 14px 16px 40px;
    scrollbar-width: thin;
}
.detail::-webkit-scrollbar { width: 7px; }
.detail::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.detail h2 { font-family: var(--serif); font-size: 1.12rem; letter-spacing: -.01em; word-break: break-word; overflow-wrap: anywhere; }
.detail .sub { color: var(--fg-3); font-size: 12px; margin: 2px 0 13px; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; margin: 0 0 14px; }
.dl dt { color: var(--fg-3); }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.sec-h {
    font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3);
    font-weight: 600; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
}
.body-text { color: var(--fg-2); line-height: 1.6; font-size: 12.5px; }
/* 作者原话用左侧竖线与 AI 摘要区分开 */
.repo-desc { border-left: 2px solid var(--line-2); padding-left: 9px; color: var(--fg); }
.pill {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--fg-2); background: var(--panel-2);
}
html[data-theme='dark'] .pill { background: #171d25; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.detail-empty { color: var(--fg-3); font-size: 12.5px; padding: 2rem 0; text-align: center; }

/* 页脚链接 */
.foot {
    grid-column: 1 / -1;
    display: none;
    align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 7px 16px; border-top: 1px solid var(--line);
    background: var(--panel); color: var(--fg-3); font-size: 11.5px;
}
.foot a { color: var(--fg-2); }

/* 对话框（窄屏详情） */
.dlg {
    width: min(46rem, 94vw); max-height: 86vh; margin: auto; padding: 0;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--fg); box-shadow: var(--shadow); overflow: hidden;
}
.dlg::backdrop { background: rgba(8, 12, 18, .6); }
.dlg-inner { max-height: 86vh; overflow-y: auto; padding: 22px 24px 20px; }
.dlg-lede { color: var(--fg-2); font-size: 12.5px; line-height: 1.6; margin: 4px 0 0; }
.dlg-note {
    margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--fg-3); font-size: 11.5px; line-height: 1.6;
}
.icon-toggle { gap: 6px; }
/* 链接网格：每项一行，名称 + 路径 + 字节数，便于直接读或复制 */
.link-grid { display: flex; flex-direction: column; gap: 2px; }
.link-grid.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
@media (max-width: 620px) { .link-grid.two-col { grid-template-columns: 1fr; } }
/* 两栏下每格更窄：名称列自适应，路径与条目数靠右 */
.link-grid.two-col .link-row { grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; }
.link-row {
    display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto;
    align-items: baseline; gap: 10px;
    padding: 5px 7px; border-radius: var(--radius-sm);
    text-decoration: none; color: var(--fg);
    transition: background .13s var(--ease);
}
html[data-theme='dark'] .link-row:hover { background: #1a212b; }
.link-row:hover { background: var(--panel-2); text-decoration: none; }
.link-row .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-row .pt { color: var(--fg-3); font-family: var(--mono); font-size: 11px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-row .sz { color: var(--fg-3); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.link-row:hover .nm { color: var(--sel); }
.dlg .close {
    position: absolute; top: .7rem; right: .8rem;
    width: 1.9rem; height: 1.9rem; display: grid; place-items: center;
    border: 1px solid transparent; border-radius: 50%; color: var(--fg-3);
}
.dlg .close:hover { color: var(--fg); border-color: var(--line); }

.scrim {
    position: fixed; inset: 0; z-index: 55; background: rgba(8, 12, 18, .5);
    opacity: 0; visibility: hidden; transition: opacity .2s var(--ease);
}
.scrim.on { opacity: 1; visibility: visible; }

/* ════════════════════════════════════════════════════════════
   3. 响应式
   ════════════════════════════════════════════════════════════ */
@media (max-width: 1180px) {
    .app { grid-template-columns: 204px minmax(0, 1fr); }
    .detail { display: none; }          /* 详情改用对话框 */
}
@media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; overflow: visible; }
    .topbar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
    .search { flex: 1 1 100%; max-width: none; order: 3; }
    /* 按钮文字不折行（见 .toggle），所以这里要允许整颗按钮换行，
       否则窄屏下 .tb-right 会把文档撑宽 */
    .tb-right { margin-left: 0; flex-wrap: wrap; }
    .tb-stat { font-size: 12px; }
    .filter-open { display: inline-flex; }
    .rail {
        position: fixed; inset: 0 auto 0 0; z-index: 60;
        width: min(20rem, 86vw); padding: 12px 0 40px;
        transform: translateX(-102%); transition: transform .25s var(--ease);
        box-shadow: var(--shadow);
    }
    .rail.open { transform: none; }
    .rail-close { display: inline-flex; margin: 0 12px 10px; }
    .main { height: auto; }
    .tablewrap { max-height: 70vh; }
    .foot { display: flex; }
    /* 窄屏隐藏次要列，保留可读的核心信息 */
    th.col-lang, td.col-lang, th.col-sub, td.col-sub { display: none; }
}
@media (max-width: 620px) {
    th.col-domain, td.col-domain, th.col-push, td.col-push { display: none; }
    .tb-stat { display: none; }   /* 极窄屏优先保证操作按钮完整可见 */
}
@media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<a class="skip" href="#rows-heading">跳到结果列表</a>

<div class="app">

    <div class="topbar">
        <div class="brand">
            <b>Stars Atlas</b>
            <span id="v-count"></span>
        </div>

        <label class="search" for="q">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/>
                <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input id="q" type="search" autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
        </label>

        <div class="tb-right">
            <span class="tb-stat" id="tb-stat" aria-live="polite"></span>
            <button class="toggle filter-open" id="filter-open" aria-controls="rail" aria-expanded="false">
                <span id="filter-open-label">筛选</span>
            </button>
            <button class="toggle" id="theme" aria-label="切换配色">
                <span id="theme-label"></span>
            </button>
            <button class="toggle" id="lang" aria-label="切换语言">
                <span id="lang-label">EN</span>
            </button>
            <button class="toggle icon-toggle" id="data-open" aria-haspopup="dialog"
                    aria-controls="data-dlg" aria-expanded="false">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="4" cy="8" r="1.6" fill="currentColor"/>
                    <path d="M6.2 8h5.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    <circle cx="13" cy="4.4" r="1.5" stroke="currentColor" stroke-width="1.3"/>
                    <circle cx="13" cy="11.6" r="1.5" stroke="currentColor" stroke-width="1.3"/>
                </svg>
                <span id="data-open-label">订阅与接口</span>
            </button>
        </div>
    </div>

    <aside class="rail" id="rail" aria-label="筛选">
        <button class="toggle rail-close" id="rail-close">关闭</button>

        <div class="group">
            <h2 id="g-domain">领域</h2>
            <div class="spine" id="spine" role="group" aria-labelledby="g-domain"></div>
        </div>

        <div class="group">
            <h2 id="g-lang">语言</h2>
            <div class="chips" id="f-lang" role="group" aria-labelledby="g-lang"></div>
            <button class="facet-more" id="lang-more" hidden></button>
        </div>

        <div class="group">

    if (skip !== 'forms' && S.forms.size && !item.forms.some(f => S.forms.has(f))) return false;
    if (skip !== 'langs' && S.langs.size && !S.langs.has(item.l)) return false;
    if (skip !== 'years' && S.years.size && !S.years.has(item.y)) return false;
    if (skip !== 'cyears' && S.cyears.size && !S.cyears.has(item.cy)) return false;
    if (skip !== 'tiers' && S.tiers.size && !S.tiers.has(tierOf(item.s))) return false;
    return true;
}

/** 搜索词唯一来源是 S.q；每次派生，避免缓存与输入框不一致 */
function searchTokens() {
    return S.q.trim() ? S.q.trim().toLowerCase().split(/\s+/).filter(Boolean) : [];
}

function match(item) {
    if (!hit(item)) return false;
    const toks = searchTokens();
    if (!toks.length) return true;
    const h = hay(item);
    for (const t of toks) if (h.indexOf(t) === -1) return false;
    return true;
}

function sortValue(item, key) {
    switch (key) {
        case 's': return item.s;
        case 'p': return item.p || '';
        case 'st': return item.st || '';
        case 'n': return item.n.toLowerCase();
        case 'l': return item.l;
        case 'cat': return CAT_BY[item.cat] ? CAT_BY[item.cat].zh : '';
        case 'sub': return item.sub && SUB_BY[item.sub] ? SUB_BY[item.sub].zh : '';
        default: return item.n.toLowerCase();
    }
}

function results() {
    const out = ITEMS.filter(match);
    const dir = S.dir === 'asc' ? 1 : -1;
    const key = S.sort;
    out.sort((a, b) => {
        const x = sortValue(a, key), y = sortValue(b, key);
        const c = (typeof x === 'number' && typeof y === 'number')
            ? x - y
            : String(x).localeCompare(String(y), S.lang === 'zh' ? 'zh' : 'en');
        return (c || a.k.localeCompare(b.k)) * dir;
    });
    return out;
}

/** 分面计数：某维度的计数 = 满足「其它所有条件」的条目数 */
function facetCounts(dim, idOf) {
    const counts = new Map();
    const toks = searchTokens();
    for (const it of ITEMS) {
        if (!hit(it, dim)) continue;
        if (toks.length) {
            const h = hay(it);
            let ok = true;
            for (const t of toks) if (h.indexOf(t) === -1) { ok = false; break; }
            if (!ok) continue;
        }
        const v = idOf(it);
        if (v == null) continue;
        if (Array.isArray(v)) { for (const x of v) counts.set(x, (counts.get(x) || 0) + 1); }
        else counts.set(v, (counts.get(v) || 0) + 1);
    }
    return counts;
}

/* ════════════════════════════════════════════════════════════
   DOM 构建器
   ════════════════════════════════════════════════════════════ */
function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
}
function chip(name, count, pressed, onToggle, disabled) {
    const b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(!!pressed));
    b.disabled = !!disabled;
    b.append(el('span', null, name));
    if (count != null) b.append(el('span', 'c num', fmt(count)));
    b.addEventListener('click', onToggle);
    return b;
}
function setToggle(set, v) { if (set.has(v)) set.delete(v); else set.add(v); }

/* ════════════════════════════════════════════════════════════
   左侧栏：领域脊 + 各分面
   ════════════════════════════════════════════════════════════ */
const LANG_FULL = 14;
const TAG_FULL = 20;
let tagFilterText = '';
let langAll = false, tagAll = false;

function renderSpine() {
    const box = $('spine');
    box.textContent = '';
    const counts = facetCounts('cats', it => it.cats);
    CATS.forEach(c => {
        if (!c.count) return;
        const n = counts.get(c.id) || 0;
        const row = el('button', 'spine-row');
        row.type = 'button';
        row.setAttribute('aria-pressed', String(S.cats.has(c.id)));
        if (!n && !S.cats.has(c.id)) row.classList.add('is-empty');
        const dot = el('span', 'dot');
        dot.style.background = c.color || 'var(--fg-3)';
        row.append(dot);
        row.append(el('span', 'spine-name', label(c)));
        row.append(el('span', 'spine-count num', String(n)));
        row.addEventListener('click', () => {
            setToggle(S.cats, c.id);
            if (!S.cats.has(c.id)) dropSubsOf(c.id);
            render();
        });
        box.append(row);

        if (S.cats.has(c.id) && c.subs.length) {
            const subs = el('div', 'subs');
            c.subs.forEach(s => {
                const sc = facetCounts('subs', it => it.sub).get(s.id) || 0;
                const b = el('button', 'sub-row');
                b.type = 'button';
                b.setAttribute('aria-pressed', String(S.subs.has(s.id)));
                b.append(el('span', null, label(s)));
                b.append(el('span', 'num', String(sc)));
                b.addEventListener('click', () => { setToggle(S.subs, s.id); render(); });
                subs.append(b);
            });
            box.append(subs);
        }
    });
}

function dropSubsOf(catId) {
    for (const sid of [...S.subs]) if (SUB_BY[sid] && SUB_BY[sid].cat === catId) S.subs.delete(sid);
}

function renderLangFacet() {
    const box = $('f-lang');
    box.textContent = '';
    const counts = facetCounts('langs', it => it.l);
    const list = langAll ? LANGS : LANGS.slice(0, LANG_FULL);
    list.forEach(l => {
        const n = counts.get(l.name) || 0;
        box.append(chip(l.name, n, S.langs.has(l.name),
            () => { setToggle(S.langs, l.name); render(); }, !n && !S.langs.has(l.name)));
    });
    const more = $('lang-more');
    more.hidden = LANGS.length <= LANG_FULL;
    more.textContent = langAll ? T().showAll + ' ↑' : `${T().showAll} (${LANGS.length})`;
    more.onclick = () => { langAll = !langAll; renderLangFacet(); };
}

function renderTagFacet() {
    const box = $('f-tag');
    box.textContent = '';
    const counts = facetCounts('tags', it => it.tags);
    const q = tagFilterText.trim().toLowerCase();
    let list = TAGS.filter(t => (counts.get(t.id) || 0) > 0 || S.tags.has(t.id));
    if (q) list = TAGS.filter(t => label(t).toLowerCase().includes(q) || t.id.includes(q));
    list.sort((a, b) => (counts.get(b.id) || 0) - (counts.get(a.id) || 0) || b.count - a.count);
    const shown = q ? list : list.slice(0, tagAll ? list.length : TAG_FULL);
    shown.forEach(t => {
        const n = counts.get(t.id) || 0;
        box.append(chip(label(t), n, S.tags.has(t.id),
            () => { setToggle(S.tags, t.id); render(); }, !n && !S.tags.has(t.id)));
    });
    if (!shown.length) box.append(el('div', 'note', '—'));
    const more = $('tag-more');
    more.hidden = !!q || list.length <= TAG_FULL;
    more.textContent = tagAll ? T().showMore + ' ↑' : `${T().showMore} (${list.length})`;
    more.onclick = () => { tagAll = !tagAll; renderTagFacet(); };
}

function renderChipFacet(boxId, source, set, valueOf, dim) {
    const box = $(boxId);
    box.textContent = '';
    const counts = facetCounts(dim, valueOf);
    source.forEach(x => {
        const id = x.id != null ? x.id : x.year;
        const n = counts.get(id) || 0;
        if (!n && !set.has(id)) return;
        // 年份这类分面没有 zh/en 字段，直接用它的值当显示名
        const name = x.id != null ? label(x) : String(x.year);
        box.append(chip(name, n, set.has(id),
            () => { setToggle(set, id); render(); }, !n && !set.has(id)));
    });
}

/* ════════════════════════════════════════════════════════════
   表格
   ════════════════════════════════════════════════════════════ */
const PAGE = 120;
let CURRENT = [];

function renderHead() {
    const tr = $('thead-row');
    tr.textContent = '';
    COLUMNS.forEach(c => {
        const th = el('th', c.cls);
        th.append(document.createTextNode(label(c.label)));
        const ar = el('span', 'ar');
        th.append(document.createTextNode(' '), ar);
        if (S.sort === c.key) {
            th.setAttribute('aria-sort', S.dir === 'asc' ? 'ascending' : 'descending');
            ar.textContent = S.dir === 'asc' ? '▲' : '▼';
        }
        th.addEventListener('click', () => {
            if (S.sort === c.key) S.dir = S.dir === 'asc' ? 'desc' : 'asc';
            else { S.sort = c.key; S.dir = DEFAULT_DIR[c.key] || 'asc'; }
            render();
        });
        tr.append(th);
    });
}

function rowNode(item, idx) {
    const tr = el('tr');
    tr.dataset.i = idx;
    if (idx === S.sel) tr.classList.add('sel');

    const name = el('td', 'name');
    const owner = el('span', null, item.o + '/');
    const repo = el('b', null, item.n);
    name.append(owner, repo);
    tr.append(name);

    tr.append(el('td', 'n star num', '★ ' + fmt(item.s)));
    tr.append(el('td', 'col-lang dim', item.l));

    const dom = el('td', 'col-domain');
    const wrap = el('span', 'dm');
    const dot = el('span', 'dot');
    dot.style.background = (CAT_BY[item.cat] && CAT_BY[item.cat].color) || 'var(--fg-3)';
    wrap.append(dot, document.createTextNode(CAT_BY[item.cat] ? CAT_BY[item.cat].zh : item.cat));
    dom.append(wrap);
    tr.append(dom);

    tr.append(el('td', 'col-sub dim', item.sub && SUB_BY[item.sub] ? SUB_BY[item.sub].zh : '—'));
    tr.append(el('td', 'col-push n dim', item.p || '—'));

    tr.addEventListener('click', () => selectRow(idx, true));
    return tr;
}

function renderRows() {
    const tb = $('tbody');
    tb.textContent = '';
    const frag = document.createDocumentFragment();
    CURRENT.slice(0, S.shown).forEach((it, i) => frag.append(rowNode(it, i)));
    tb.append(frag);

    const empty = $('empty-state');
    const none = !CURRENT.length;
    empty.hidden = !none;
    if (none) {
        $('empty-title').textContent = T().none;
        $('empty-hint').textContent = T().noneHint;
        $('empty-clear').textContent = T().clear;
    }
}

function appendMore() {
    const target = Math.min(S.shown + PAGE, CURRENT.length);
    if (target <= S.shown) return;
    const tb = $('tbody');
    const frag = document.createDocumentFragment();
    for (let i = S.shown; i < target; i++) frag.append(rowNode(CURRENT[i], i));
    tb.append(frag);
    S.shown = target;
}

function selectRow(idx, openDialog) {
    if (idx < 0 || idx >= CURRENT.length) return;
    S.sel = idx;
    [...$('tbody').children].forEach((tr, i) => tr.classList.toggle('sel', i === idx));
    const tr = $('tbody').children[idx];
    if (tr) tr.scrollIntoView({ block: 'nearest' });
    showDetail(CURRENT[idx], openDialog);
}

/* ════════════════════════════════════════════════════════════
   详情面板
   ════════════════════════════════════════════════════════════ */
function buildDetail(item) {
    const box = document.createDocumentFragment();

    box.append(el('h2', null, item.k));
    const sub = [item.o, item.l, CAT_BY[item.cat] ? CAT_BY[item.cat].zh : ''] .filter(Boolean).join(' · ');
    box.append(el('div', 'sub', sub + ' · ' + T().starredAt + ' ' + (item.st || '—')));

    // 统计：全部来自 GitHub 原始字段
    const dl = el('dl', 'dl');
    const stat = (k, v) => { dl.append(el('dt', null, k)); dl.append(el('dd', 'num', v)); };
    stat(T().starsN, '★ ' + fmt(item.s));
    stat(T().language, item.l);
    stat(T().cat, CAT_BY[item.cat] ? CAT_BY[item.cat].zh : '—');
    stat(T().sub, item.sub && SUB_BY[item.sub] ? SUB_BY[item.sub].zh : '—');
    stat(T().starredAt, item.st || '—');
    stat(T().created, item.cr || '—');
    stat(T().pushedAt, item.p || '—');
    box.append(dl);

    const acts = el('div', 'detail-actions');
    const a1 = el('a', 'btn primary', T().github);
    a1.href = item.u; a1.target = '_blank'; a1.rel = 'noopener noreferrer';
    acts.append(a1);
    if (item.h) {
        const a2 = el('a', 'btn', T().home);
        a2.href = item.h; a2.target = '_blank'; a2.rel = 'noopener noreferrer';
        acts.append(a2);
    }
    box.append(acts);

    // 顺序固定：作者原话 -> AI 摘要 -> AI 标签 -> 项目自带标签
    const section = (title, node) => {
        const s = el('div');
        s.append(el('div', 'sec-h', title));
        s.append(node);
        box.append(s);
    };

    const descP = el('div', 'body-text repo-desc',
        item.d || T().noDesc);
    section(T().desc, descP);

    const body = S.lang === 'zh' ? (item.z || item.e) : (item.e || item.z);
    if (body) section(T().summary, el('div', 'body-text', body));

    if (item.tags.length) {
        const c = el('div', 'chips');
        item.tags.forEach(t => { if (TAG_BY[t]) c.append(el('span', 'pill', label(TAG_BY[t]))); });
        section(T().aiTags, c);
    }
    if (item.t.length) {
        const c = el('div', 'chips');
        item.t.forEach(t => c.append(el('span', 'pill', t)));
        section(T().repoTopics, c);
    }
    if (item.forms.length) {
        const c = el('div', 'chips');
        item.forms.forEach(f => { if (FORM_BY[f]) c.append(el('span', 'pill', label(FORM_BY[f]))); });
        section(T().forms, c);
    }
    return box;
}

/**
 * 渲染详情。
 *
 * `openDialog` 必须区分「渲染」与「用户主动打开」：窄屏下若每次 render 都调用
 * showModal()，页面一加载就会弹出一个盖住列表的对话框（曾经如此）。
 * 因此只有用户点击某一行时才允许弹出。
 */
function showDetail(item, openDialog) {
    if (isWide()) {
        const panel = $('detail');
        panel.textContent = '';
        if (!item) { panel.append(el('div', 'detail-empty', T().detailEmpty)); return; }
        panel.append(buildDetail(item));
        return;
    }
    // 窄屏：详情走对话框，且仅在用户主动选择时打开
    const dlg = $('dlg');
    if (!openDialog) return;
    const inner = $('dlg-inner');
    inner.textContent = '';
    if (!item) return;
    inner.append(buildDetail(item));
    if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); }
    else dlg.setAttribute('open', '');
}

/* ════════════════════════════════════════════════════════════
   订阅与数据接口面板
   ════════════════════════════════════════════════════════════ */

/** 一行链接：名称 + 可复制的相对路径 + 附注（订阅源显示条目数） */
function linkRow(name, path, extra) {
    const a = el('a', 'link-row');
    a.href = path;
    a.target = '_blank';
    a.rel = 'noopener';
    a.append(el('span', 'nm', name));
    a.append(el('span', 'pt', path));
    a.append(el('span', 'sz', extra || ''));
    return a;
}

function renderDataPanel() {
    const t = T();
    $('data-title').textContent = t.dataTitle;
    $('data-lede').textContent = t.dataLede;
    $('data-feed-h').textContent = t.dataFeed;
    $('data-api-h').textContent = t.dataApi;
    $('data-note').textContent = t.dataNote;

    // RSS：全站 + 每个有内容的领域（对应的 feed-<id>.xml 由构建脚本生成）
    const feeds = $('data-feeds');
    feeds.textContent = '';
    feeds.append(linkRow(t.dataAll, 'feed.xml', String(META.count)));
    CATS.filter(c => c.count).forEach(c => {
        feeds.append(linkRow(label(c), `feed-${c.id}.xml`, String(c.count)));
    });

    // 接口：按「先看目录、再取分片」的顺序排列
    const apis = $('data-apis');
    apis.textContent = '';
    [
        [t.apiIndex, 'api/index.json'],
        [t.apiIndexJsonl, 'api/index.jsonl'],
        [t.apiCorpus, 'api/repos.jsonl'],
        [t.apiReadme, 'api/README.md'],
        [t.apiLlms, 'llms.txt'],
    ].forEach(([name, path]) => apis.append(linkRow(name, path, '')));
}

function openDataPanel() {
    renderDataPanel();
    const d = $('data-dlg');
    if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); }
    else d.setAttribute('open', '');
    $('data-open').setAttribute('aria-expanded', 'true');
}

/* ════════════════════════════════════════════════════════════
   渲染总入口
   ════════════════════════════════════════════════════════════ */
function render() {
    CURRENT = results();
    if (S.sel >= CURRENT.length) S.sel = 0;
    S.shown = Math.min(PAGE, CURRENT.length);

    renderSpine();
    renderLangFacet();
    renderTagFacet();
    renderChipFacet('f-form', FORMS, S.forms, it => it.forms, 'forms');
    renderChipFacet('f-year', YEARS, S.years, it => it.y, 'years');
    renderChipFacet('f-cyear', CREATED_YEARS, S.cyears, it => it.cy, 'cyears');
    renderTierFacet();
    renderHead();
    renderRows();

    $('count').innerHTML = T().count(CURRENT.length, ITEMS.length);
    $('tb-stat').innerHTML = `<b>${CURRENT.length}</b> ${T().repos} · ` + META.starsCompact + ' ★';

    renderActive();
    updateStatic();
    showDetail(CURRENT[S.sel] || null, false);
    saveHash();
}

function renderTierFacet() {
    const box = $('f-tier');
    box.textContent = '';
    const counts = facetCounts('tiers', it => tierOf(it.s));
    [1, 2, 3].forEach(t => {
        const n = counts.get(t) || 0;
        if (!n && !S.tiers.has(t)) return;
        box.append(chip(TIER_LABEL[S.lang][t], n, S.tiers.has(t),
            () => { setToggle(S.tiers, t); render(); }, !n && !S.tiers.has(t)));
    });
}

function renderActive() {
    const box = $('active');
    box.textContent = '';
    const add = (name, set, v) => box.append(chip(name, null, true, () => { set.delete(v); render(); }));
    S.cats.forEach(v => add(label(CAT_BY[v]), S.cats, v));
    S.subs.forEach(v => add(label(SUB_BY[v]), S.subs, v));
    S.tags.forEach(v => add(label(TAG_BY[v]), S.tags, v));
    S.forms.forEach(v => add(label(FORM_BY[v]), S.forms, v));
    S.langs.forEach(v => add(v, S.langs, v));
    S.years.forEach(v => add(String(v), S.years, v));
    S.cyears.forEach(v => add(String(v), S.cyears, v));
    S.tiers.forEach(v => add(TIER_LABEL[S.lang][v], S.tiers, v));
    if (S.q.trim()) box.append(chip(`“${S.q.trim()}”`, null, true, () => { S.q = ''; $('q').value = ''; render(); }));
    if (box.children.length) {
        const btn = el('button', 'clear', T().clear);
        btn.type = 'button';
        btn.addEventListener('click', clearAll);
        box.append(btn);
    }
}

function clearAll() {
    S.cats.clear(); S.subs.clear(); S.tags.clear();
    S.forms.clear(); S.langs.clear(); S.years.clear(); S.cyears.clear(); S.tiers.clear();
    S.q = ''; $('q').value = '';
    S.sort = 's'; S.dir = 'desc';
    render();
}

function updateStatic() {
    const t = T();
    $('q').placeholder = t.search;
    $('v-count').textContent = META.count + ' ' + t.repos;
    $('g-domain').textContent = t.domain;
    $('g-lang').textContent = t.lang;
    $('g-tag').textContent = t.tag;

    $('g-year').textContent = t.year;

/* ════════════════════════════════════════════════════════════
   无限滚动
   ════════════════════════════════════════════════════════════ */
if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && S.shown < CURRENT.length) appendMore();
    }, { rootMargin: '600px' }).observe($('sentinel'));
}

/* ════════════════════════════════════════════════════════════
   交互绑定
   ════════════════════════════════════════════════════════════ */
let qTimer = null;
$('q').addEventListener('input', (e) => {
    const v = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { S.q = v; render(); }, 140);
});
$('tag-search').addEventListener('input', (e) => { tagFilterText = e.target.value; renderTagFacet(); });
$('empty-clear').addEventListener('click', clearAll);

document.addEventListener('keydown', (e) => {
    const typing = document.activeElement === $('q') || document.activeElement === $('tag-search');
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }
    if (typing) {
        if (e.key === 'Escape') { $('q').value = ''; $('q').dispatchEvent(new Event('input')); }
        return;
    }
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); selectRow(Math.min(S.sel + 1, CURRENT.length - 1)); }
    if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); selectRow(Math.max(S.sel - 1, 0)); }
    if (e.key === 'Enter' && CURRENT[S.sel]) window.open(CURRENT[S.sel].u, '_blank', 'noopener');
});

$('theme').addEventListener('click', () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    localStorage.setItem('atlas.theme', S.theme);
    updateStatic();
});
$('lang').addEventListener('click', () => {
    S.lang = S.lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('atlas.lang', S.lang);
    render();
});

const rail = $('rail'), scrim = $('scrim');
function openRail(v) {
    rail.classList.toggle('open', v);
    scrim.classList.toggle('on', v);
    $('filter-open').setAttribute('aria-expanded', String(v));
}
$('filter-open').addEventListener('click', () => openRail(!rail.classList.contains('open')));
$('rail-close').addEventListener('click', () => openRail(false));
scrim.addEventListener('click', () => openRail(false));

$('data-open').addEventListener('click', openDataPanel);
$('data-close').addEventListener('click', () => $('data-dlg').close());
$('data-dlg').addEventListener('click', (e) => { if (e.target === $('data-dlg')) $('data-dlg').close(); });
$('data-dlg').addEventListener('close', () => $('data-open').setAttribute('aria-expanded', 'false'));

$('dlg-close').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });

let rTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(rTimer);
    rTimer = setTimeout(() => { showDetail(CURRENT[S.sel] || null, false); }, 150);
});

/* ════════════════════════════════════════════════════════════
   URL 状态：筛选可分享
   ════════════════════════════════════════════════════════════ */
function saveHash() {
    const p = new URLSearchParams();
    if (S.q.trim()) p.set('q', S.q.trim());
    const put = (k, s) => { if (s.size) p.set(k, [...s].join(',')); };
    put('cat', S.cats); put('sub', S.subs); put('tag', S.tags);
    put('form', S.forms); put('lang', S.langs); put('year', S.years); put('cyear', S.cyears); put('tier', S.tiers);
    if (S.sort !== 's') p.set('sort', S.sort);
    if (S.dir !== 'desc') p.set('dir', S.dir);
    const h = p.toString();
    history.replaceState(null, '', h ? '#' + h : location.pathname);
}

function loadHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    // 先清空，让「后退 / 手动改 hash」也能正确切回上一次的视图
    S.cats.clear(); S.subs.clear(); S.tags.clear();
    S.forms.clear(); S.langs.clear(); S.years.clear(); S.cyears.clear(); S.tiers.clear();
    S.q = ''; S.sort = 's'; S.dir = 'desc'; S.sel = 0;
    const get = (k, set, cast) => {
        const v = p.get(k);
        if (v) v.split(',').filter(Boolean).forEach(x => set.add(cast ? cast(x) : x));
    };
    if (p.get('q')) S.q = p.get('q');
    get('cat', S.cats); get('sub', S.subs); get('tag', S.tags);
    get('form', S.forms); get('lang', S.langs); get('year', S.years, Number);
    get('cyear', S.cyears, Number); get('tier', S.tiers, Number);
    if (p.get('sort')) S.sort = p.get('sort');
    if (p.get('dir')) S.dir = p.get('dir');
    $('q').value = S.q;
}
window.addEventListener('hashchange', () => { loadHash(); render(); });

/* ════════════════════════════════════════════════════════════
   启动
   ════════════════════════════════════════════════════════════ */
(function boot() {
    S.theme = localStorage.getItem('atlas.theme') || 'light';
    S.lang = localStorage.getItem('atlas.lang') || 'zh';
    document.documentElement.dataset.theme = S.theme;
    loadHash();
    render();
    if (isWide()) {
        // 宽屏先选第一条，右侧面板不留空白（窄屏不预选，避免弹出遮挡列表的对话框）
        selectRow(0, false);
    }
})();
